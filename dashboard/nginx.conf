server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard uses client-side routing (hooks/useRoute.js, real URLs
    # like /playground, /api-keys via history.pushState) - any path that
    # isn't a real static file falls back to index.html so React's router
    # can handle it, instead of nginx 404ing a hard refresh/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
